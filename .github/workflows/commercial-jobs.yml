name: Commercial queue
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployed worker
        env:
          URL: ${{ secrets.MEMORYGUARD_COMMERCE_URL }}
          SECRET: ${{ secrets.MEMORYGUARD_CRON_SECRET }}
        run: |
          test -n "$URL" && test -n "$SECRET"
          curl --fail --silent --show-error -X POST "$URL/api/cron/process" -H "X-Cron-Secret: $SECRET"
